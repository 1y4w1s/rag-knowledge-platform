# RAG 回归检测 CI（已弃用 · V1.0-C5）
#
# 此 workflow 已弃用，功能已合并到 ci.yml 的 rag-* + benchmark-gate jobs。
# 不再挂在 pull_request 上（continue-on-error 会制造「绿勾但未门禁」的假象）。
# 仅保留 workflow_dispatch 供历史对照；将在后续清理窗删除。
# 正式回归请看 ci.yml → rag-golden / rag-enterprise / rag-advanced / benchmark-gate。

name: RAG Regression

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  regression-deprecated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deprecated notice
        run: |
          echo "This workflow is deprecated and is not a PR gate."
          echo "Use .github/workflows/ci.yml (rag-* + benchmark-gate) for release protection."
          echo "Historical soft regression lived here; removed from pull_request triggers in V1.0-C5."
