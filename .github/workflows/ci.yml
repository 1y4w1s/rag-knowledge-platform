name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ruige:changeme@localhost:5432/ruige
      JWT_SECRET: ${{ secrets.JWT_SECRET || '1362b8353e8306574369454872b0fb2a' }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruige
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'changeme' }}
          POSTGRES_DB: ruige
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruige"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install 'pytest>=8.3,<9' 'pytest-asyncio>=0.24,<0.25' httpx python-docx openpyxl python-pptx reportlab python-jose resend ruff==0.15.22 pytest-mock

      - name: Full test collection gate (0 errors)
        run: |
          python -m pytest --collect-only -q

      - name: Lint with ruff
        run: |
          ruff check . --output-format=github

      - name: Apply migrations
        run: |
          alembic upgrade head

      - name: Test migration rollback
        run: |
          alembic downgrade -1 && alembic upgrade head

      - name: Run core tests
        run: |
          python -m pytest tests/test_smoke.py tests/test_auth.py tests/test_workspace_scope.py tests/test_citations.py tests/test_search_documents.py tests/test_search_content.py tests/test_generation.py tests/test_knowledge_bases.py tests/test_document_list_pagination.py tests/test_knowledge_base_list_pagination.py tests/test_db_disconnect.py tests/test_upload_security.py tests/test_document_visibility.py tests/test_retrieval_security.py tests/test_preview.py tests/test_upload_failure.py tests/test_embedding_5xx.py tests/test_llm_5xx.py tests/test_m1_smoke.py tests/test_rag_relevance.py -v --tb=short

      - name: Run RAG + ingestion tests
        run: |
          python -m pytest tests/test_retrieval_golden.py tests/test_retrieval_hybrid.py tests/test_rerank.py tests/test_chunker.py tests/test_ingestion_golden.py tests/test_pptx_ingestion.py tests/test_xlsx_ingestion.py -v --tb=short

      - name: Run chat + streaming tests
        run: |
          python -m pytest tests/test_chat.py tests/test_r4_4_streaming.py tests/test_citation_resolve.py -v --tb=short

  # D gate (masterplan 0.2): model/migration drift fails CI
  alembic-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ruige:changeme@localhost:5432/ruige
      JWT_SECRET: ${{ secrets.JWT_SECRET || '1362b8353e8306574369454872b0fb2a' }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruige
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'changeme' }}
          POSTGRES_DB: ruige
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruige"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Apply migrations to head
        run: |
          alembic upgrade head

      - name: Model vs migration drift check (autogenerate diff must be empty)
        run: |
          alembic check

  # C gate (masterplan 0.3): dead config / env bypass fails CI
  config-wiring:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || '1362b8353e8306574369454872b0fb2a' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install 'pytest>=8.3,<9'

      - name: Config wiring contract (all Settings fields referenced, env access whitelisted)
        run: |
          python -m pytest tests/test_config_wiring.py -q --no-header

  # Phase 2 P1: partial parallel (P0 PARTIALLY_PARALLEL_SAFE).
  # Datasets independent; baseline = artifact fan-in; new scorer stays with Golden
  # (KEEP_NEW_SCORER_WITH_GOLDEN — not artifact-only / shared-DB latest-KB footgun).
  rag-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_ENDPOINT: https://hf-mirror.com

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruige
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'changeme' }}
          POSTGRES_DB: ruige
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruige"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fastembed-bge-small-zh-${{ runner.os }}

      - name: Set mirror for model download
        run: echo "HF_ENDPOINT=https://hf-mirror.com" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Apply migrations
        run: |
          cd backend && alembic upgrade head

      - name: Run Golden QA benchmark (real embeddings)
        env:
          DATABASE_URL: postgresql+asyncpg://ruige:changeme@localhost:5432/ruige
          JWT_SECRET: ${{ secrets.JWT_SECRET || '1362b8353e8306574369454872b0fb2a' }}
          RAG_RATE_LIMIT_MODE: bypass
          PYTHONPATH: backend
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RAG_TEST_PASSWORD: ${{ secrets.RAG_TEST_PASSWORD }}
        run: |
          python scripts/run_benchmark.py --dataset golden_qa --mode retrieval --output text 2>&1 | tee backend/benchmark_output.txt
          echo "BENCHMARK_DONE=1" >> $GITHUB_ENV

      - name: New scoring engine comparison (experimental)
        run: |
          python3 backend/scripts/ci_new_scorer.py

      - name: Upload Golden benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-golden
          path: backend/benchmark_output.txt
          if-no-files-found: error

  rag-enterprise:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_ENDPOINT: https://hf-mirror.com

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruige
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'changeme' }}
          POSTGRES_DB: ruige
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruige"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fastembed-bge-small-zh-${{ runner.os }}

      - name: Set mirror for model download
        run: echo "HF_ENDPOINT=https://hf-mirror.com" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Apply migrations
        run: |
          cd backend && alembic upgrade head

      - name: Run Enterprise QA benchmark (C3 gate)
        env:
          DATABASE_URL: postgresql+asyncpg://ruige:changeme@localhost:5432/ruige
          JWT_SECRET: ${{ secrets.JWT_SECRET || '1362b8353e8306574369454872b0fb2a' }}
          RAG_RATE_LIMIT_MODE: bypass
          PYTHONPATH: backend
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RAG_TEST_PASSWORD: ${{ secrets.RAG_TEST_PASSWORD }}
        run: |
          python scripts/run_benchmark.py --dataset enterprise_qa --mode retrieval --output text --skip-entity-extract 2>&1 | tee backend/benchmark_enterprise.txt

      - name: Upload Enterprise benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-enterprise
          path: backend/benchmark_enterprise.txt
          if-no-files-found: error

  rag-advanced:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_ENDPOINT: https://hf-mirror.com

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruige
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'changeme' }}
          POSTGRES_DB: ruige
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruige"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fastembed-bge-small-zh-${{ runner.os }}

      - name: Set mirror for model download
        run: echo "HF_ENDPOINT=https://hf-mirror.com" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Apply migrations
        run: |
          cd backend && alembic upgrade head

      - name: Run Advanced QA benchmark (C3 gate)
        env:
          DATABASE_URL: postgresql+asyncpg://ruige:changeme@localhost:5432/ruige
          JWT_SECRET: ${{ secrets.JWT_SECRET || '1362b8353e8306574369454872b0fb2a' }}
          RAG_RATE_LIMIT_MODE: bypass
          PYTHONPATH: backend
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RAG_TEST_PASSWORD: ${{ secrets.RAG_TEST_PASSWORD }}
        run: |
          python scripts/run_benchmark.py --dataset advanced_qa --mode retrieval --output text 2>&1 | tee backend/benchmark_advanced.txt

      - name: Upload Advanced benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-advanced
          path: backend/benchmark_advanced.txt
          if-no-files-found: error

  benchmark-gate:
    runs-on: ubuntu-latest
    needs: [rag-golden, rag-enterprise, rag-advanced]
    steps:
      - uses: actions/checkout@v4

      - name: Download Golden benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-golden
          path: backend

      - name: Download Enterprise benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-enterprise
          path: backend

      - name: Download Advanced benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-advanced
          path: backend

      - name: Compare with baseline (C3 gates)
        env:
          BASELINE_PATH: backend/tests/benchmark/baseline.json
          BENCHMARK_OUT_FILES: backend/benchmark_output.txt,backend/benchmark_enterprise.txt,backend/benchmark_advanced.txt
        run: |
          python3 backend/scripts/ci_baseline_check.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.15.22

      - name: Lint backend
        run: ruff check backend/ --output-format=github

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend builds
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm test
