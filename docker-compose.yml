# ruige stack: Postgres + API + Celery + Redis
services:
  postgres:
    build:
      context: ./docker/postgres
      pull: false
    image: ruige-postgres:16-pgvector
    container_name: ruige-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ruige
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (T6-DC-1)}
      POSTGRES_DB: ruige
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "lock_timeout=5s"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ruige -d ruige"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          # 必须 ≥ DB 实际工作集（shared_buffers + max_connections×work_mem + 开销）。
          # 旧值 768M 与 shared_buffers=2GB 冲突，Postgres 启动即被 OOM killer 杀掉 → 崩溃循环。
          memory: 1G

  api:
    build:
      context: ./backend
      pull: false
    container_name: ruige-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ruige:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (T6-DC-1)}@postgres:5432/ruige
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      HF_ENDPOINT: https://hf-mirror.com
      REDIS_URL: redis://redis:6379/1
      RATE_LIMIT_BACKEND: redis
      # P0-05：单跳 nginx 反代，X-Forwarded-For 由 nginx 覆写为 $remote_addr
      TRUSTED_PROXY_COUNT: "1"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER_LOCAL: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;r=httpx.get('http://localhost:8000/health');exit(0 if r.json().get('database')=='ok' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 6G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - uploads_data:/app/uploads
      - ./backend/models:/app/models

  migrate:
    build:
      context: ./backend
      pull: false
    container_name: ruige-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ruige:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (T6-DC-1)}@postgres:5432/ruige
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  celery-worker:
    build:
      context: ./backend
      pull: false
    container_name: ruige-celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ruige:${POSTGRES_PASSWORD:-changeme}@postgres:5432/ruige
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER_LOCAL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "celery", "-A", "app.services.ingestion.celery_app", "worker", "--loglevel=info", "--concurrency=10", "--pool=threads"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
    volumes:
      - uploads_data:/app/uploads

  redis:
    image: redis:7-alpine
    container_name: ruige-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  uploads_data:
  redis_data:
