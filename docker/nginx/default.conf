# 睿阁 EW-B4 · nginx 静态前端 + API 反代
# web 容器内 api 主机名由 docker compose 网络解析

server {
    # NW-57：非 root 不能绑 80；compose 映射 80:8080
    listen 8080;
    server_name _;

    # ── 安全响应头（全站默认）──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # SSE 对话流：关闭缓冲，拉长读超时
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 运维探活（与 api:8000/health 一致；smoke 仍可直接打 8000）
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 文档预览路径：允许 iframe 内嵌（X-Frame-Options 放开）
    location ~* ^/api/v1/knowledge-bases/[^/]+/documents/[^/]+/preview$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Frame-Options "" always;
    }

    # React Router SPA：深链刷新回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
